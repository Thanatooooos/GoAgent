name: goagent-graph-probe

services:
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

  lightrag:
    image: ghcr.io/hkuds/lightrag@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    ports:
      - "127.0.0.1:9621:9621"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9621"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
    volumes:
      - lightrag-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - ollama
    restart: "no"

  lightrag-siliconflow:
    profiles: [siliconflow]
    image: ghcr.io/hkuds/lightrag@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    ports:
      - "127.0.0.1:9622:9621"
    env_file:
      - .env.siliconflow
    environment:
      HOST: 0.0.0.0
      PORT: "9621"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
    volumes:
      - lightrag-siliconflow-data-v2:/app/data
      - ./.env.siliconflow:/app/.env:ro
    depends_on:
      - ollama
    restart: "no"

volumes:
  ollama-models:
  lightrag-data:
  lightrag-siliconflow-data-v2:
